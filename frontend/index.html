<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 论文阅读助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: linear-gradient(180deg, #f8fafc 0%, #eff6ff 45%, #f8fafc 100%);
    min-height: 100vh;
  }
  ::selection { background: #bfdbfe; }
  /* 上传区虚线动效 */
  @keyframes dashmove { to { stroke-dashoffset: -24; } }
  .dash-line { animation: dashmove 1.2s linear infinite; }
  /* 卡片悬浮 */
  .card-hover { transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .card-hover:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -14px rgba(37, 99, 235, .28);
    border-color: #bfdbfe;
  }
  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>
</head>
<body class="text-slate-800">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
  // API 地址自适应：本地 file:// 打开走 127.0.0.1:8000；http(s) 部署/穿透后同源
  const API = location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8000';

const MODES = [
  ['title', '标题', '🏷️'],
  ['content', '内容', '🔍'],
  ['rank', '排序', '📊'],
];

function App() {
  const [view, setView] = useState('home');
  const [papers, setPapers] = useState([]);
  const [current, setCurrent] = useState(null);
  const [card, setCard] = useState(null);
  const [loadingCard, setLoadingCard] = useState(false);
  const [qas, setQas] = useState([]);
  const [question, setQuestion] = useState('');
  const [asking, setAsking] = useState(false);
  const [searchBox, setSearchBox] = useState('');
  const [searchMode, setSearchMode] = useState('title');
  const [contentResults, setContentResults] = useState(null);
  const [searching, setSearching] = useState(false);
  const [rankResults, setRankResults] = useState(null);
  const [ranking, setRanking] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [drag, setDrag] = useState(false);
  const [err, setErr] = useState('');
  const fileRef = React.createRef();

  function refreshPapers() {
    fetch(API + '/papers')
      .then(r => r.json())
      .then(setPapers)
      .catch(() => setErr('无法连接后端。请先双击 start.bat 启动服务'));
  }
  useEffect(refreshPapers, []);

  async function upload(file) {
    if (!file) return;
    if (!/\.(pdf|docx|txt)$/i.test(file.name)) { setErr('仅支持 PDF / Word(.docx) / TXT 文件'); return; }
    setUploading(true); setErr('');
    try {
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch(API + '/papers/upload', { method: 'POST', body: fd });
      if (!r.ok) { const j = await r.json(); throw new Error(j.detail || '上传失败'); }
      const j = await r.json();
      await refreshPapers();
      openPaper(j.id, j.title);
    } catch (e) { setErr('上传失败: ' + e.message + '（请确认已双击 start.bat 启动后端）'); }
    setUploading(false);
  }

  async function openPaper(id, title) {
    setCurrent({ id, title });
    setView('reader');
    setCard(null); setQas([]); setQuestion(''); setErr('');
    setLoadingCard(true);
    try {
      const [r, q] = await Promise.all([
        fetch(API + '/papers/' + id + '/reading-card'),
        fetch(API + '/papers/' + id + '/questions'),
      ]);
      if (!r.ok) { const j = await r.json(); throw new Error(j.detail || '生成失败'); }
      setCard(await r.json());
      const history = await q.json();
      setQas(history.map(x => ({ question: x.question, answer: x.answer })));
    } catch (e) { setErr('生成阅读卡失败: ' + e.message); }
    setLoadingCard(false);
  }

  async function doSearch() {
    const q = searchBox.trim();
    if (!q || searching || ranking) return;
    if (searchMode === 'title') return; // 标题模式为本地即时过滤，无需请求
    if (searchMode === 'content') {
      setSearching(true); setErr('');
      try {
        const r = await fetch(API + '/search?q=' + encodeURIComponent(q));
        if (!r.ok) { const j = await r.json(); throw new Error(j.detail || '搜索失败'); }
        setContentResults(await r.json());
      } catch (e) { setErr('搜索失败: ' + e.message); setContentResults(null); }
      setSearching(false);
    } else {
      setRanking(true); setErr('');
      try {
        const r = await fetch(API + '/search/rank?include_zero=1&topic=' + encodeURIComponent(q));
        if (!r.ok) { const j = await r.json(); throw new Error(j.detail || '排序失败'); }
        setRankResults(await r.json());
      } catch (e) { setErr('排序失败: ' + e.message); setRankResults(null); }
      setRanking(false);
    }
  }

  function switchMode(m) {
    if (m === searchMode) return;
    setSearchMode(m);
    setContentResults(null);
    setRankResults(null);
  }

  async function ask() {
    const q = question.trim();
    if (!q || asking) return;
    setAsking(true); setErr('');
    try {
      const r = await fetch(API + '/papers/' + current.id + '/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      if (!r.ok) { const j = await r.json(); throw new Error(j.detail || '提问失败'); }
      const j = await r.json();
      setQas(prev => [...prev, { question: q, answer: j.answer }]);
      setQuestion('');
    } catch (e) { setErr('提问失败: ' + e.message); }
    setAsking(false);
  }

  async function removePaper(id) {
    if (!confirm('删除后不可恢复，确定删除这篇论文吗？')) return;
    await fetch(API + '/papers/' + id, { method: 'DELETE' }).catch(() => {});
    refreshPapers();
  }

  // 标题模式：本地即时过滤；其他模式展示全库（结果区单独呈现）
  const filtered = searchMode === 'title'
    ? papers.filter(p => !searchBox || (p.title || '').toLowerCase().includes(searchBox.toLowerCase()))
    : papers;

  const placeholders = {
    title: '按标题过滤，如：transformer',
    content: '搜索论文内容，如：注意力机制',
    rank: '按主题给全库排序，如：transformer',
  };

  // 有搜索结果时（内容/排序模式），用结果区替代文献库卡片网格
  const hasResult = (searchMode === 'content' && contentResults !== null) ||
                    (searchMode === 'rank' && rankResults !== null);

  if (view === 'reader' && current) {
    return <Reader current={current} card={card} loadingCard={loadingCard}
      qas={qas} question={question} setQuestion={setQuestion} ask={ask} asking={asking}
      err={err} onBack={() => { setView('home'); refreshPapers(); }} />;
  }

  return (
    <div className="max-w-5xl mx-auto px-6 py-10">
      {/* 头部 */}
      <header className="mb-8 text-center sm:text-left">
        <div className="flex items-center justify-center sm:justify-start gap-3 mb-2">
          <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-500 flex items-center justify-center text-white text-xl shadow-lg shadow-blue-500/25">
            📚
          </div>
          <h1 className="text-3xl font-bold text-slate-900 tracking-tight">AI 论文阅读助手</h1>
        </div>
        <p className="text-slate-500 mt-2">拖入 PDF / Word / TXT，一键生成摘要、大纲、术语解释与结论，可追问、可跨篇搜索</p>
      </header>

      {err && <div className="mb-4 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl px-4 py-3 text-sm">{err}</div>}

      {/* 上传区 */}
      <div
        onDragOver={e => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={e => { e.preventDefault(); setDrag(false); upload(e.dataTransfer.files[0]); }}
        onClick={() => fileRef.current && fileRef.current.click()}
        className={"card-hover mb-6 border-2 border-dashed rounded-2xl p-8 text-center cursor-pointer bg-white/70 backdrop-blur-sm " +
          (drag ? "border-blue-500 bg-blue-50 scale-[1.01]" : "border-slate-300 hover:border-blue-400")}
      >
        <input ref={fileRef} type="file" accept=".pdf,.docx,.txt" className="hidden"
          onChange={e => { upload(e.target.files[0]); e.target.value = ''; }} />
        <div className={"mx-auto w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mb-3 transition-colors " +
          (drag ? "bg-blue-500 text-white" : "bg-blue-50 text-blue-600")}>
          {uploading ? "⏳" : "📄"}
        </div>
        <div className="font-semibold text-slate-700">{uploading ? "正在解析并入库…" : "拖拽 PDF / Word / TXT 到此处，或点击选择文件"}</div>
        <div className="text-sm text-slate-400 mt-1.5">解析后自动清理文档原件，本地只保留文本（方案 A）</div>
      </div>

      {/* 文献库 */}
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <h2 className="text-xl font-semibold text-slate-900">📚 我的文献库
          <span className="ml-2 text-sm font-normal text-slate-400 bg-slate-200/70 rounded-full px-2.5 py-0.5 align-middle">{papers.length}</span>
        </h2>
        <div className="flex items-center gap-2">
          <div className="flex bg-white/80 border border-slate-200 rounded-xl p-1 text-sm shadow-sm">
            {MODES.map(([m, label, icon]) => (
              <button key={m} onClick={() => switchMode(m)}
                className={"flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all " +
                  (searchMode === m
                    ? "bg-gradient-to-r from-blue-600 to-blue-500 text-white shadow-md shadow-blue-500/25 font-medium"
                    : "text-slate-500 hover:text-slate-800 hover:bg-slate-100")}>
                <span className="text-xs">{icon}</span>{label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div className="relative flex gap-2 mb-6">
        <div className="relative flex-1">
          <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">
            {searchMode === 'title' ? '🏷️' : searchMode === 'content' ? '🔍' : '📊'}
          </span>
          <input value={searchBox} onChange={e => setSearchBox(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') doSearch(); }}
            placeholder={placeholders[searchMode]}
            className="w-full border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm bg-white/80 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 shadow-sm" />
        </div>
        {searchMode !== 'title' && (
          <button onClick={doSearch} disabled={searching || ranking || !searchBox.trim()}
            className="bg-gradient-to-r from-blue-600 to-blue-500 disabled:from-slate-300 disabled:to-slate-300 text-white rounded-xl px-6 py-2.5 text-sm font-medium shadow-md shadow-blue-500/25 hover:shadow-lg hover:shadow-blue-500/30 transition-shadow">
            {(searching || ranking) ? "…" : "搜索"}
          </button>
        )}
      </div>

      {/* 内容搜索（跨篇搜段落）结果 */}
      {searchMode === 'content' && contentResults !== null && (
        <div className="mb-6 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
          <h3 className="font-semibold text-slate-800 mb-4">🔍 全文检索「{searchBox}」</h3>
          {contentResults.length === 0 ? (
            <div className="text-sm text-slate-400">没有找到相关段落，换个词试试</div>
          ) : (
            <div className="space-y-3">
              {contentResults.map(r => (
                <div key={r.paper_id} className="card-hover border border-slate-100 rounded-xl p-4 hover:bg-slate-50 cursor-pointer">
                  <div className="flex items-center justify-between">
                    <div className="font-semibold text-blue-700 text-sm">{r.title}</div>
                    <div className="text-xs text-slate-400">相关度 <span className="font-medium text-blue-600">{r.score}</span> · {r.matches.length} 处命中</div>
                  </div>
                  <div className="space-y-1.5 mt-2.5">
                    {r.matches.map(m => (
                      <div key={m.chunk_id} className="text-sm text-slate-600 leading-relaxed bg-slate-50 rounded-lg px-3 py-2">
                        <span className="text-slate-400 text-xs mr-2">第 {m.page} 页</span>{m.snippet}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* 排序（全库相关度排名）结果 */}
      {searchMode === 'rank' && rankResults !== null && (
        <div className="mb-6 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
          <h3 className="font-semibold text-slate-800 mb-4">📊 全库按「{searchBox}」相关度排序</h3>
          {rankResults.length === 0 ? (
            <div className="text-sm text-slate-400">文献库为空，先上传几篇论文吧</div>
          ) : (
            <div className="space-y-1.5">
              {rankResults.map((r, i) => (
                <div key={r.paper_id}
                  className={"card-hover flex items-center gap-3 rounded-xl px-4 py-2.5 cursor-pointer border " +
                    (r.hits > 0 ? "border-slate-100 hover:bg-slate-50" : "border-transparent opacity-60")}
                  onClick={() => openPaper(r.paper_id, r.title)}>
                  <div className={"w-6 h-6 rounded-full text-xs flex items-center justify-center shrink-0 " +
                    (i < 3 && r.hits > 0 ? "bg-gradient-to-br from-amber-400 to-orange-400 text-white font-bold" :
                     r.hits > 0 ? "bg-blue-50 text-blue-600 font-semibold" : "bg-slate-100 text-slate-400")}>
                    {i + 1}
                  </div>
                  <div className={"text-sm flex-1 line-clamp-1 " + (r.hits > 0 ? "font-medium text-slate-800" : "text-slate-400")}>{r.title}</div>
                  <div className="text-xs text-slate-400 whitespace-nowrap">
                    {r.hits > 0 ? `${r.hit_chunks}/${r.total_chunks} 块命中` : '未命中'}
                  </div>
                  <div className={"text-xs font-medium whitespace-nowrap w-16 text-right " + (r.hits > 0 ? "text-blue-600" : "text-slate-300")}>相关度 {r.score}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* 文献库卡片（标题过滤模式即时筛；内容/排序模式有结果时隐藏，避免重复） */}
      {!hasResult && (
        filtered.length === 0 ? (
          <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400 shadow-sm">
            <div className="text-4xl mb-3">{papers.length === 0 ? '📭' : '🔍'}</div>
            {papers.length === 0 ? '还没有论文，先上传一篇试试' : '没有标题匹配的论文，试试"内容"或"排序"方式'}
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(p => (
              <div key={p.id} className="card-hover bg-white rounded-xl border border-slate-200 p-4 shadow-sm group">
                <div className="font-medium text-slate-800 line-clamp-2">{p.title}</div>
                <div className="text-xs text-slate-400 mt-2">{p.created_at} · {p.chunk_count} 块</div>
                <div className="flex justify-between mt-3">
                  <button onClick={() => openPaper(p.id, p.title)}
                    className="text-sm text-blue-600 hover:text-blue-800 font-medium">📖 阅读卡 →</button>
                  <button onClick={() => removePaper(p.id)}
                    className="text-sm text-slate-400 hover:text-rose-500 opacity-0 group-hover:opacity-100">删除</button>
                </div>
              </div>
            ))}
          </div>
        )
      )}
    </div>
  );
}

function Reader({ current, card, loadingCard, qas, question, setQuestion, ask, asking, err, onBack }) {
  const [citeOpen, setCiteOpen] = useState(false);
  const [citations, setCitations] = useState(null);
  const [citeLoading, setCiteLoading] = useState(false);
  const [copied, setCopied] = useState('');

  async function loadCitations() {
    if (citeOpen) { setCiteOpen(false); return; }
    setCiteOpen(true);
    if (citations) return;
    setCiteLoading(true);
    try {
      const r = await fetch(API + '/papers/' + current.id + '/citations');
      if (r.ok) setCitations(await r.json());
    } catch (e) {}
    setCiteLoading(false);
  }

  async function copyText(key, text) {
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      setCopied(key);
      setTimeout(() => setCopied(''), 1500);
    } catch (e) {}
  }

  return (
    <div className="max-w-6xl mx-auto px-6 py-10">
      <div className="flex items-center gap-4 mb-6 flex-wrap">
        <button onClick={onBack} className="text-blue-600 hover:text-blue-800 font-medium">← 返回文献库</button>
        <h1 className="text-xl font-bold text-slate-900 truncate flex-1">{current.title}</h1>
        <button onClick={loadCitations}
          className="bg-white border border-slate-200 text-slate-600 text-sm rounded-lg px-4 py-2 font-medium hover:bg-slate-50 hover:border-slate-300 transition-colors">📎 引用</button>
        <a href={API + '/papers/' + current.id + '/export?format=pdf'} download
          className="bg-gradient-to-r from-slate-800 to-slate-700 text-white text-sm rounded-lg px-4 py-2 font-medium shadow-sm hover:shadow-md transition-shadow">📄 导出 PDF</a>
        <a href={API + '/papers/' + current.id + '/export'} target="_blank" rel="noreferrer"
          className="bg-white border border-slate-200 text-slate-600 text-sm rounded-lg px-4 py-2 font-medium hover:bg-slate-50 hover:border-slate-300 transition-colors">🌐 HTML</a>
      </div>

      {err && <div className="mb-4 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl px-4 py-3 text-sm">{err}</div>}

      {/* 引用面板 */}
      {citeOpen && (
        <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm mb-6">
          <h3 className="font-semibold text-slate-800 mb-3">📎 引用本文（一键复制）</h3>
          {citeLoading ? (
            <div className="text-sm text-slate-400">正在生成引用格式（首次调用 AI，约 5 秒）…</div>
          ) : citations ? (
            <div className="space-y-4">
              {[['GB/T 7714', citations.gbt771], ['BibTeX', citations.bibtex], ['APA 7th', citations.apa]].map(([label, text]) => (
                <div key={label}>
                  <div className="flex items-center justify-between mb-1">
                    <div className="text-xs font-semibold text-slate-500">{label}</div>
                    <button onClick={() => copyText(label, text)}
                      className="text-xs text-blue-600 hover:text-blue-800 font-medium">{copied === label ? '✓ 已复制' : '复制'}</button>
                  </div>
                  <pre className="text-xs bg-slate-50 rounded-lg p-3 overflow-x-auto whitespace-pre-wrap text-slate-700 leading-relaxed">{text}</pre>
                </div>
              ))}
            </div>
          ) : <div className="text-sm text-slate-400">生成失败，请重试</div>}
        </div>
      )}

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        {/* 阅读卡 */}
        <div className="lg:col-span-2 space-y-4">
          {loadingCard ? (
            <div className="bg-white rounded-2xl border border-slate-200 p-16 text-center text-slate-400 shadow-sm">
              <div className="text-4xl mb-3 animate-pulse">⏳</div>
              <div className="text-sm">正在生成阅读卡（首次调用 AI 约需 10-30 秒）…</div>
            </div>
          ) : !card ? (
            <div className="bg-white rounded-2xl border border-slate-200 p-16 text-center text-slate-400 shadow-sm">暂无内容</div>
          ) : (
            <>
              <Section icon="📋" title="一句话摘要" tint="bg-blue-50" bar="from-blue-500 to-blue-400">
                <p className="text-slate-700 leading-relaxed">{card.summary}</p>
              </Section>
              <Section icon="🧭" title="章节大纲" tint="bg-emerald-50" bar="from-emerald-500 to-teal-400">
                <ol className="space-y-1.5">
                  {(card.outline || []).map((o, i) => <li key={i} className="text-slate-700 flex gap-2"><span className="text-emerald-500 font-semibold shrink-0">{i + 1}.</span><span>{o}</span></li>)}
                </ol>
              </Section>
              <Section icon="📖" title="术语解释" tint="bg-amber-50" bar="from-amber-500 to-orange-400">
                <ul className="space-y-2">
                  {(card.terms || []).map((t, i) => (
                    <li key={i} className="text-slate-700 flex gap-2 items-start">
                      <span className="font-medium text-slate-900 bg-amber-100 text-amber-800 rounded-md px-2 py-0.5 text-sm shrink-0 whitespace-nowrap">{t.term}</span>
                      <span className="text-slate-400">—</span>
                      <span>{t.explanation}</span>
                    </li>
                  ))}
                </ul>
              </Section>
              <Section icon="✅" title="核心结论" tint="bg-rose-50" bar="from-rose-500 to-pink-400">
                <ul className="space-y-1.5">
                  {(card.conclusions || []).map((c, i) => <li key={i} className="text-slate-700 flex gap-2"><span className="text-rose-400 shrink-0">•</span><span>{c}</span></li>)}
                </ul>
              </Section>
            </>
          )}
        </div>

        {/* 追问 */}
        <div className="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col shadow-sm" style={{ maxHeight: '70vh' }}>
          <h3 className="font-semibold text-slate-800 mb-3">💬 追问这篇论文</h3>
          <div className="flex-1 overflow-y-auto space-y-4 mb-4 pr-1">
            {qas.length === 0 ? (
              <div className="text-sm text-slate-400 bg-slate-50 rounded-xl p-4">问点什么，比如"作者的核心论据是什么？"</div>
            ) : qas.map((qa, i) => (
              <div key={i}>
                <div className="bg-blue-50 text-blue-800 rounded-xl rounded-br-none px-3 py-2 text-sm mb-2">{qa.question}</div>
                <div className="bg-slate-50 text-slate-700 rounded-xl rounded-bl-none px-3 py-2 text-sm leading-relaxed whitespace-pre-wrap">{qa.answer}</div>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input value={question} onChange={e => setQuestion(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') ask(); }}
              placeholder="输入你的问题…"
              className="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm" />
            <button onClick={ask} disabled={asking || !question.trim()}
              className="bg-gradient-to-r from-blue-600 to-blue-500 disabled:from-slate-300 disabled:to-slate-300 text-white rounded-xl px-4 py-2 text-sm font-medium shadow-sm shadow-blue-500/20 hover:shadow-md transition-shadow">
              {asking ? "…" : "发送"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Section({ icon, title, children, tint = 'bg-blue-50', bar = 'from-blue-500 to-blue-400' }) {
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm overflow-hidden relative">
      <div className={`absolute inset-x-0 top-0 h-1 bg-gradient-to-r ${bar}`}></div>
      <h3 className={`font-semibold text-slate-800 mb-3 inline-flex items-center gap-2 ${tint} rounded-lg px-3 py-1.5`}>
        <span>{icon}</span>{title}
      </h3>
      <div className="mt-1">{children}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
